[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glow-hdengine"
version = "0.0.0"
description = "Glow HD Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hdctl = "engine.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "adapter*", "presenter*"]
