name: rails_closed_refusal
rails:
  SAFE_MODE: "1"
  ALLOW_NETWORK: "0"
  LC_ALL: C
  LANG: C
  TZ: UTC
scope: hde-epic031-pr-01-local-deterministic
live_vendor_calls: forbidden
steps:
