name: logs_keys_only_redaction
rails:
  SAFE_MODE: "1"
  ALLOW_NETWORK: "0"
  LC_ALL: C
  LANG: C
  TZ: UTC
scope: reusable-hde-rails-keys-only-redaction-local-deterministic
live_vendor_calls: forbidden
steps:
  - command: python tools/evidence/generate_rails_gate_evidence.py --check
    proves:
      - SAFE rails vendor logs are keys-only and payload-free
      - plaintext secrets raw secret headers bodies payloads and birth data are absent from governed samples
      - route outcome rails_state timeout_profile retry metadata and failure classes are bounded
  - command: python -m pytest tests/bodygraph/test_vendor_client.py tests/bodygraph/test_resolver_vendor.py -q
    proves:
      - local mocked provider log posture remains tested without live vendor calls
