name: rails_open_conformance
rails:
  SAFE_MODE: "0"
  ALLOW_NETWORK: "1"
  LC_ALL: C
  LANG: C
  TZ: UTC
scope: reusable-hde-rails-open-conformance-fixture-backed-mocked-non-live
live_vendor_calls: forbidden
steps:
  - command: python -m pytest tests/bodygraph/test_vendor_client.py tests/evidence/test_open_rails_abba_proof.py -q
    proves:
      - fixture-backed open rails provider policy is mocked non-live and live vendor calls are forbidden
      - retry timeout and backoff profile sets are pinned integer values with no jitter
      - retries occur only for network_error and 5xx while HTTP 429 and other 4xx are not retried
      - redirects are not followed and Retry-After parsing is deterministic
      - established ABBA contract Reader CLI coherence two-run identity open-versus-closed identity canonical JSON single LF and zero transport calls are tested
  - command: python tools/evidence/generate_open_rails_abba_proof.py --check-current
    accepted_release_not_admitted_exit_code: 3
    proves:
      - current fixture-backed open-rails ABBA proof rebuilds canonically without rewriting the frozen capture once the active release is admitted
      - while the active release is not admitted (INCOMPLETE_RELEASE_ROSTER) the check prints OPEN_RAILS_ABBA_CHECK:RELEASE_NOT_ADMITTED and exits 3 after validating the frozen primary by hash, writing nothing and performing no live Reader or CLI capture
      - live vendor calls are forbidden in CI
      - Reader and CLI outputs match for both orders
      - two-run identity holds for both orders
      - open rails computation matches closed rails baseline computation
      - canonical JSON emits exactly one terminal LF with no CRLF
      - transport-call count is zero
