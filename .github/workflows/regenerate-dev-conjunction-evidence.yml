name: Regenerate dev conjunction identity evidence

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      LANG: C
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - name: Regenerate dev conjunction evidence
        env:
          APP_ENV: dev
          SAFE_MODE: "0"
          ALLOW_NETWORK: "1"
        run: python tools/evidence/generate_conjunction_writer_evidence.py
      - name: Refresh governed index and proofs
        env:
          SAFE_MODE: "1"
          ALLOW_NETWORK: "0"
        run: |
          python tools/evidence/update_evidence_index.py
          python tools/evidence/orientation_demo.py
      - name: Verify focused regressions
        env:
          SAFE_MODE: "1"
          ALLOW_NETWORK: "0"
        run: |
          APP_ENV=dev SAFE_MODE=0 ALLOW_NETWORK=1 python tools/evidence/generate_conjunction_writer_evidence.py --check
          python tools/cli/generate_cli_conformance_artifacts.py --check
          python tools/evidence/update_evidence_index.py --check
          python tools/evidence/orientation_demo.py --check
          python ci/checks/check_mirror_schema.sh
          bash ci/checks/check_evidence_index_hash.sh
          bash ci/checks/check_final_lf.sh
          python tools/evidence/validate_evidence_paths.py
          python -m pytest tests/http/test_dev_conjunction_http.py tests/adapter/test_compat_http_dev.py tests/evidence/test_dev_conjunction_identity.py tests/evidence/test_cli_conformance_artifacts.py
      - name: Commit canonical outputs
        run: |
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo "Governed evidence already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refresh dev conjunction identity evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
