name: regenerate-showcompat-evidence

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      LANG: C
      TZ: UTC
      SAFE_MODE: "1"
      ALLOW_NETWORK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: test -f requirements.txt && python -m pip install -r requirements.txt || true
      - run: test -f requirements-dev.txt && python -m pip install -r requirements-dev.txt || true
      - run: python -m pip install -e .
      - run: python tools/cli/generate_showcompat_artifacts.py
      - run: python tools/evidence/update_evidence_index.py
      - run: python tools/evidence/orientation_demo.py
      - run: python tools/cli/generate_showcompat_artifacts.py --check
      - run: python tools/evidence/update_evidence_index.py --check
      - run: python tools/evidence/orientation_demo.py --check
      - run: ci/checks/check_evidence_index_hash.sh
      - run: ci/checks/check_mirror_schema.sh
      - run: ci/checks/check_final_lf.sh
      - run: python tools/evidence/validate_evidence_paths.py
      - name: Commit canonical regenerated evidence
        run: |
          if git diff --quiet; then
            echo "No generated evidence changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "regenerate showcompat immutable identity evidence"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
