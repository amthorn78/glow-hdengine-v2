name: Regenerate identity release closure

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      LANG: C
      TZ: UTC
      SAFE_MODE: "1"
      ALLOW_NETWORK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: test -f requirements.txt && python -m pip install -r requirements.txt || true
      - run: test -f requirements-dev.txt && python -m pip install -r requirements-dev.txt || true
      - run: python -m pip install -e . pytest
      - name: Regenerate complete identity closure
        run: python tools/evidence/regenerate_identity_closure.py
      - name: Verify closure is read only
        env:
          PIP_NO_INDEX: "1"
        run: |
          before="$(git status --porcelain)"
          python tools/evidence/regenerate_identity_closure.py --check
          after="$(git status --porcelain)"
          test "$before" = "$after"
      - name: Verify retired conditional aliases are absent
        run: |
          if rg -n "cond_if_(none_match|modified_since)_headers\.txt"             docs/acceptance_map_epic022.json             audit/qa/hde-epic022/token_evidence_matrix.md             tests/qa/test_epic022_acceptance_scaffold.py; then
            exit 1
          fi
      - name: Show remaining prior release references
        run: rg -n "077bcb55b30c5384be754567c388c210ca3004f2fd9f9187d6861e2faffe58f5" . || true
      - name: Run closure regressions
        env:
          PIP_NO_INDEX: "1"
        run: |
          python -m pytest             tests/runtime/test_identity.py             tests/evidence/test_identity_provenance.py             tests/evidence/test_release_bindings.py             tests/evidence/test_release_manifest_content_binding.py             tests/evidence/test_aux_preview_identity_parity.py             tests/evidence/test_cli_conformance_artifacts.py             tests/evidence/test_internal_version_manifest_captures.py             tests/qa/test_epic022_acceptance_scaffold.py             tests/qa/test_epic022_close_pack_ready.py             tests/transport/test_internal_version_contract.py             tests/cli/test_showcompat_parity_and_identity.py             tests/cli/test_cli_canonical_bytes.py
      - name: Verify governed evidence
        run: |
          python tools/evidence/update_evidence_index.py --check
          python tools/evidence/orientation_demo.py --check
          python ci/checks/check_mirror_schema.sh
          bash ci/checks/check_evidence_index_hash.sh
          bash ci/checks/check_final_lf.sh
          python tools/evidence/validate_evidence_paths.py
      - name: Commit canonical outputs
        run: |
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo "Identity closure already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "regenerate identity release closure"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
