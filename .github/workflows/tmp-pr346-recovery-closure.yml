name: Temporary PR 346 recovery closure

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: pr-346-recovery-closure
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SAFE_MODE: "1"
      ALLOW_NETWORK: "0"
      LC_ALL: C
      LANG: C
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implement-pr-01-identity-and-evidence-foundations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: test -f requirements.txt && python -m pip install -r requirements.txt || true
      - run: test -f requirements-dev.txt && python -m pip install -r requirements-dev.txt || true
      - run: python -m pip install -e .
      - name: Regenerate and verify the complete governed closure
        run: python tools/evidence/regenerate_identity_closure.py
      - name: Run recovery regression tests
        run: |
          python -m pytest             tests/evidence/test_release_manifest_content_binding.py             tests/evidence/test_canonical_json_gate_check_outputs.py             -q
      - name: Remove this temporary runner and stabilize package metadata
        run: |
          git rm .github/workflows/tmp-pr346-recovery-closure.yml
          python -m pip install -e .
          if grep -Fq ".github/workflows/tmp-pr346-recovery-closure.yml" glow_hdengine.egg-info/SOURCES.txt; then
            echo "temporary workflow leaked into SOURCES.txt" >&2
            exit 1
          fi
      - name: Verify generated tree and publish one closure commit
        run: |
          python tools/evidence/regenerate_identity_closure.py --check
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "regenerate recovery evidence closure"
          git push origin HEAD:codex/implement-pr-01-identity-and-evidence-foundations
