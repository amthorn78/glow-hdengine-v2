name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      LANG: C
      TZ: UTC
      SAFE_MODE: "1"
      ALLOW_NETWORK: "0"
    # Determinism-sensitive CI rails remain closed: LC_ALL=C, LANG=C, TZ=UTC, SAFE_MODE=1, ALLOW_NETWORK=0.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: test -f requirements.txt && python -m pip install -r requirements.txt || true
      - run: test -f requirements-dev.txt && python -m pip install -r requirements-dev.txt || true
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: ci/checks/check_env_pins.sh
      - run: ci/checks/check_cli_help.sh
      - name: Verify committed closure before any write-capable QA
        env:
          PIP_NO_INDEX: "1"
        run: |
          git diff --exit-code
          python tools/evidence/regenerate_identity_closure.py --check
          git diff --exit-code
      # D3 (HDE-EPIC018): CLI serializer/emitter guards (PF09/PF19 rails)
      - run: python tools/cli/serializer_grep_guard.py
      - run: python tools/cli/emitter_symbol_proof.py
      - name: Run canonical JSON gate (closed rails)
        run: python tools/evidence/run_canonical_json_gate.py --check-only
      - run: python tools/order/generate_ordering_artifacts.py --check
      - run: python tools/evidence/update_evidence_index.py --check
      - run: python tools/evidence/orientation_demo.py --check
      - name: Run PO-006 token registry validity check + report (gated)
        run: |
          set +e
          python tools/evidence/check_po_006_token_registry_validity.py check --check
          check_status=$?
          python tools/evidence/check_po_006_token_registry_validity.py report
          report_status=$?
          set -e
          cat audit/qa/hde-epic024/remediation/s2_dev_acceptance_artifacts/po_006_token_registry_validity_summary.md || true
          cat audit/qa/hde-epic024/remediation/s2_dev_acceptance_artifacts/po_006_token_registry_validity_report.json || true
          cat audit/qa/hde-epic024/checks/po-006_token_registry_validity/primary.log || true
          cat audit/qa/hde-epic024/checks/po-006_token_registry_validity/token_comparison.json || true
          if [ "$check_status" -ne 0 ]; then
            exit "$check_status"
          fi
          exit "$report_status"
      - run: python tools/evidence/refresh_step_logs_manifest.py --check
      - run: ci/checks/check_evidence_index_hash.sh
      - run: python ci/checks/check_direct_db_contract.py
      - run: ci/checks/check_mirror_schema.sh
      - run: ci/checks/check_final_lf.sh
      - name: Run EPIC021 QA harness entrypoint self-test (closed rails)
        env:
          EPIC021_QA_RUN_ID: ci-selftest-epic021
        run: python -m pytest tests/qa/test_epic021_harness_entrypoint.py
      # Legacy evidence tests below intentionally build ephemeral EPIC020/021
      # artifacts. The committed closure has already been verified read-only above.
      - run: python -m pytest tests/evidence tests/ops/test_evidence_index.py tests/ops/test_hde_epic038_ops03.py
      - run: python -m pytest tests/order tests/mech/test_order_properties.py
      - run: python -m pytest tests/cli/test_serializer_guards.py
  compat-conj-pr01-closure:
    name: PR-01 compat conjunction closure (independent lane)
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      LANG: C
      TZ: UTC
      SAFE_MODE: "1"
      ALLOW_NETWORK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: test -f requirements.txt && python -m pip install -r requirements.txt || true
      - run: test -f requirements-dev.txt && python -m pip install -r requirements-dev.txt || true
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: ci/checks/check_env_pins.sh
      - name: Run compat-only identity-hash closure assertions
        run: |
          python -m pytest -q tests/http/test_compat_endpoint_contract.py::test_conjunction_identity_hash_artifact_matches_canonical_bytes
          python -m pytest -q tests/ops/test_evidence_index.py::test_evidence_index_has_required_compat_artifacts
  epic020:
    name: epic020 acceptance suites (closed rails)
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      LANG: C
      TZ: UTC
      SAFE_MODE: "1"
      ALLOW_NETWORK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: test -f requirements.txt && python -m pip install -r requirements.txt || true
      - run: test -f requirements-dev.txt && python -m pip install -r requirements-dev.txt || true
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: ci/checks/check_env_pins.sh
      - name: Run EPIC020 determinism-rails acceptance tests
        run: |
          python -m pytest \
            tests/adapter/test_jsonschema.py \
            tests/cli/test_cli_usage_and_errors.py \
            tests/cli/test_errors_parity.py \
            tests/cli/test_cli_canonical_bytes.py \
            tests/cli/test_showcompat_parity_and_identity.py \
            tests/cli/test_serializer_guards.py \
            tests/transport/test_internal_version_contract.py \
            tests/qa/test_epic020_qa_docs.py
  compat-http-epic020:
    name: EPIC020 compat HTTP coverage (closed rails)
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      LANG: C
      TZ: UTC
      SAFE_MODE: "1"
      ALLOW_NETWORK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: test -f requirements.txt && python -m pip install -r requirements.txt || true
      - run: test -f requirements-dev.txt && python -m pip install -r requirements-dev.txt || true
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: ci/checks/check_env_pins.sh
      - name: Run dev + wsgi compat HTTP tests
        run: |
          python -m pytest \
            tests/adapter/test_compat_http_dev.py \
            tests/adapter/test_compat_http_parity.py
  epic020-evidence-bundles:
    name: EPIC020 evidence bundles and index (closed rails)
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      LANG: C
      TZ: UTC
      SAFE_MODE: "1"
      ALLOW_NETWORK: "0"
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: test -f requirements.txt && python -m pip install -r requirements.txt || true
      - run: test -f requirements-dev.txt && python -m pip install -r requirements-dev.txt || true
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: ci/checks/check_env_pins.sh
      - run: python -m tools.evidence.epic020_bundle build --epic-id HDE-EPIC020
      - run: python tools/evidence/update_evidence_index.py --epic-id HDE-EPIC020
      - run: ci/checks/check_mirror_schema.sh
      - run: python -m pytest tests/evidence/test_epic020_bundle_index_integration.py
  rails-policy-gates:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      LANG: C
      TZ: UTC
      SAFE_MODE: "1"
      ALLOW_NETWORK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: test -f requirements.txt && python -m pip install -r requirements.txt || true
      - run: test -f requirements-dev.txt && python -m pip install -r requirements-dev.txt || true
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: python -m pytest --version
      - run: python ci/checks/run_rails_job_definitions.py ci/jobs/rails_closed_refusal.yml ci/jobs/rails_open_conformance.yml ci/jobs/logs_keys_only_redaction.yml
  sanity-pipeline:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      LANG: C
      TZ: UTC
      SAFE_MODE: "1"
      ALLOW_NETWORK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: test -f requirements.txt && python -m pip install -r requirements.txt || true
      - run: test -f requirements-dev.txt && python -m pip install -r requirements-dev.txt || true
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - name: Run sanity pipeline
        run: python tools/evidence/run_sanity_pipeline.py
