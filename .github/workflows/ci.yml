name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      LANG: C
      TZ: UTC
      SAFE_MODE: "1"
      ALLOW_NETWORK: "0"
      APP_ENV: dev
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify affected CI lanes
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 ci/checks/classify_ci_changes.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --event-name "${{ github.event_name }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        id: python_setup
        if: ${{ steps.classify.outputs.needs_python == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install applicable validation dependencies
        id: dependencies
        if: ${{ steps.classify.outputs.needs_python == 'true' }}
        run: >-
          python -m pip install
          'setuptools>=68' wheel
          -r requirements.txt
          -r requirements-dev.txt
          -e .

      - name: Verify closed deterministic environment
        id: env_pins
        if: ${{ steps.classify.outputs.needs_python == 'true' }}
        run: ci/checks/check_env_pins.sh

      - name: Run product mechanics and ordering lane
        id: product_lane
        if: ${{ steps.classify.outputs.product == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/order/generate_ordering_artifacts.py --check
          python -m pytest -q \
            tests/order \
            tests/mech/test_order_properties.py \
            tests/evidence/test_architecture_snapshot.py

      - name: Run CLI and compatibility lane
        id: compat_lane
        if: ${{ steps.classify.outputs.compat == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ci/checks/check_cli_help.sh
          python tools/cli/serializer_grep_guard.py
          python tools/cli/emitter_symbol_proof.py
          python -m pytest -q \
            tests/adapter/test_jsonschema.py \
            tests/cli/test_cli_usage_and_errors.py \
            tests/cli/test_errors_parity.py \
            tests/cli/test_cli_canonical_bytes.py \
            tests/cli/test_showcompat_parity_and_identity.py \
            tests/cli/test_serializer_guards.py \
            tests/transport/test_internal_version_contract.py \
            tests/http/test_compat_endpoint_contract.py \
            tests/adapter/test_compat_http_dev.py \
            tests/adapter/test_compat_http_parity.py

      - name: Run database and runtime-contract lane
        id: db_lane
        if: ${{ steps.classify.outputs.db == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python ci/checks/check_direct_db_contract.py
          python -m pytest -q \
            tests/db \
            tests/unit/test_check_direct_db_contract.py \
            tests/bodygraph/test_bg_resolve_v2_mapped_cache.py \
            tests/bodygraph/test_hde_epic038_mapped_cache_smoke.py \
            tests/bodygraph/test_ingest.py \
            tests/ops/test_capture_rails_open_scope.py \
            tests/ops/test_http_logging.py

      - name: Run rails policy and secret-safety lane
        id: rails_lane
        if: ${{ steps.classify.outputs.rails == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python ci/checks/run_rails_job_definitions.py \
            ci/jobs/rails_closed_refusal.yml \
            ci/jobs/rails_open_conformance.yml \
            ci/jobs/logs_keys_only_redaction.yml
          python -m pytest -q tests/evidence/test_rails_ci_workflow_integration.py

      - name: Run governed evidence integrity lane
        id: evidence_lane
        if: ${{ steps.classify.outputs.evidence == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/evidence/update_evidence_index.py --check
          python tools/evidence/orientation_demo.py --check
          python tools/evidence/refresh_step_logs_manifest.py --check
          ci/checks/check_evidence_index_hash.sh
          python tools/evidence/validate_evidence_paths.py
          ci/checks/check_mirror_schema.sh
          ci/checks/check_final_lf.sh
          python -m pytest -q \
            tests/evidence/test_evidence_index_missing_state.py \
            tests/evidence/test_evidence_skeleton.py \
            tests/evidence/test_machine_mirror_self_proof.py \
            tests/evidence/test_orientation_demo.py \
            tests/ops/test_evidence_index.py \
            tests/qa/test_epic020_qa_docs.py

      - name: Run approved generic QA subsystem lane in isolation
        id: qa_lane
        if: ${{ steps.classify.outputs.qa == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          qa_source="$RUNNER_TEMP/hde-generic-qa-tests"
          cleanup() {
            git worktree remove --force "$qa_source" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$qa_source" "$(git rev-parse HEAD)"
          (
            cd "$qa_source"
            unset GH_TOKEN
            export LC_ALL=C LANG=C TZ=UTC SAFE_MODE=1 ALLOW_NETWORK=0 APP_ENV=dev PYTHONDONTWRITEBYTECODE=1
            export PYTHONPATH="$qa_source"
            python -m pytest -q \
              tests/qa/test_generic_qa_harness.py \
              tests/qa/test_qa_harness_followup.py \
              tests/qa/test_epic021_harness_entrypoint.py \
              tests/qa/test_epic021_acceptance_alignment.py \
              tests/qa/test_tooling_bootstrap.py \
              tests/qa/test_viability_generator_wrappers.py \
              tests/qa/test_epic029_requalification.py
          )
          cleanup
          trap - EXIT

      - name: Build and verify exact-source release attestation
        id: release_lane
        if: ${{ steps.classify.outputs.release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          attestation_root="$RUNNER_TEMP/hde-release-attestation"
          release_test_source="$RUNNER_TEMP/hde-release-regression-tests"
          cleanup() {
            git worktree remove --force "$release_test_source" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          test ! -e "$attestation_root"
          test ! -e "$release_test_source"
          git diff --exit-code
          python scripts/release_id_recompute.py --check-manifest-only
          git worktree add --detach "$release_test_source" "$(git rev-parse HEAD)"
          (
            cd "$release_test_source"
            export PYTHONPATH="$release_test_source"
            python -m pytest -q \
              tests/runtime/test_identity.py \
              tests/evidence/test_release_attestation.py \
              tests/evidence/test_release_manifest_content_binding.py \
              tests/evidence/test_sanity_pipeline.py
          )
          cleanup
          trap - EXIT
          test -z "$(git status --short --untracked-files=all)"
          python tools/evidence/build_release_attestation.py \
            --output "$attestation_root" \
            --require-clean
          python tools/evidence/build_release_attestation.py \
            --verify "$attestation_root" \
            --require-clean
          git diff --exit-code
          test -z "$(git status --short --untracked-files=all)"

      - name: Verify truthful applicability and clean candidate tree
        id: final_audit
        if: ${{ always() }}
        shell: bash
        env:
          CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
          NEEDS_PYTHON: ${{ steps.classify.outputs.needs_python }}
          PYTHON_SETUP_OUTCOME: ${{ steps.python_setup.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          ENV_PINS_OUTCOME: ${{ steps.env_pins.outcome }}
          PRODUCT: ${{ steps.classify.outputs.product }}
          PRODUCT_OUTCOME: ${{ steps.product_lane.outcome }}
          COMPAT: ${{ steps.classify.outputs.compat }}
          COMPAT_OUTCOME: ${{ steps.compat_lane.outcome }}
          DB: ${{ steps.classify.outputs.db }}
          DB_OUTCOME: ${{ steps.db_lane.outcome }}
          RAILS: ${{ steps.classify.outputs.rails }}
          RAILS_OUTCOME: ${{ steps.rails_lane.outcome }}
          EVIDENCE: ${{ steps.classify.outputs.evidence }}
          EVIDENCE_OUTCOME: ${{ steps.evidence_lane.outcome }}
          QA: ${{ steps.classify.outputs.qa }}
          QA_OUTCOME: ${{ steps.qa_lane.outcome }}
          RELEASE: ${{ steps.classify.outputs.release }}
          RELEASE_OUTCOME: ${{ steps.release_lane.outcome }}
        run: |
          set -uo pipefail
          failed=0

          require_outcome() {
            flag=$1
            outcome=$2
            label=$3
            if [[ "$flag" == "true" && "$outcome" != "success" ]]; then
              echo "APPLICABLE_CI_LANE_NOT_SUCCESSFUL:$label:$outcome" >&2
              failed=1
            elif [[ "$flag" == "false" && "$outcome" != "skipped" ]]; then
              echo "INAPPLICABLE_CI_LANE_NOT_SKIPPED:$label:$outcome" >&2
              failed=1
            elif [[ "$flag" != "true" && "$flag" != "false" ]]; then
              echo "CI_LANE_APPLICABILITY_INVALID:$label:$flag" >&2
              failed=1
            fi
          }

          if [[ "$CLASSIFY_OUTCOME" != "success" ]]; then
            echo "CI_CHANGE_CLASSIFICATION_NOT_SUCCESSFUL:$CLASSIFY_OUTCOME" >&2
            failed=1
          fi
          require_outcome "$NEEDS_PYTHON" "$PYTHON_SETUP_OUTCOME" python-setup
          require_outcome "$NEEDS_PYTHON" "$DEPENDENCIES_OUTCOME" dependencies
          require_outcome "$NEEDS_PYTHON" "$ENV_PINS_OUTCOME" environment-pins
          require_outcome "$PRODUCT" "$PRODUCT_OUTCOME" product
          require_outcome "$COMPAT" "$COMPAT_OUTCOME" compatibility
          require_outcome "$DB" "$DB_OUTCOME" database
          require_outcome "$RAILS" "$RAILS_OUTCOME" rails
          require_outcome "$EVIDENCE" "$EVIDENCE_OUTCOME" evidence
          require_outcome "$QA" "$QA_OUTCOME" qa
          require_outcome "$RELEASE" "$RELEASE_OUTCOME" release

          git diff --check || failed=1
          git diff --exit-code || failed=1
          status=$(git status --short --untracked-files=all)
          if [[ -n "$status" ]]; then
            echo "CI_CANDIDATE_TREE_NOT_CLEAN" >&2
            echo "$status" >&2
            failed=1
          fi
          if (( failed != 0 )); then
            exit 1
          fi
          echo "CI_APPLICABILITY_AND_EXACT_HEAD_OK"
