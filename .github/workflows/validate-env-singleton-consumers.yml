name: Validate env singleton consumers

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      LANG: C
      TZ: UTC
      SAFE_MODE: "1"
      ALLOW_NETWORK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - name: Validate migrated QA consumer
        run: |
          python tools/evidence/generate_env_matrix_snapshot.py --check
          python -m pytest tests/evidence/test_env_matrix_snapshot_v3.py
          bash scripts/qa/epic009_precommit.sh
      - name: Prove ingest order independence
        run: |
          before=$(sha256sum artifacts/runtime/env_matrix.snapshot.json | cut -d' ' -f1)
          set +e
          python scripts/ingest/run_vendor_ingest.py > /tmp/vendor-ingest.stdout 2> /tmp/vendor-ingest.stderr
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            exit "$rc"
          fi
          after=$(sha256sum artifacts/runtime/env_matrix.snapshot.json | cut -d' ' -f1)
          test "$before" = "$after"
          python tools/evidence/generate_env_matrix_snapshot.py --check
