name: Regenerate PF09.6 env evidence

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      LANG: C
      TZ: UTC
      SAFE_MODE: "1"
      ALLOW_NETWORK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - name: Regenerate governed evidence
        run: |
          python tools/evidence/generate_env_matrix_snapshot.py
          python tools/evidence/update_evidence_index.py
          python tools/evidence/orientation_demo.py
      - name: Verify governed evidence
        run: |
          python tools/evidence/generate_env_matrix_snapshot.py --check
          python tools/evidence/update_evidence_index.py --check
          python tools/evidence/orientation_demo.py --check
          python -m pytest tests/evidence/test_env_matrix_snapshot_v3.py
          bash ci/checks/check_evidence_index_hash.sh
          python ci/checks/check_mirror_schema.sh
          bash ci/checks/check_final_lf.sh
          python tools/evidence/validate_evidence_paths.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Regenerate PF09.6 env snapshot evidence"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
