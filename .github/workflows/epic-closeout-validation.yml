name: epic-closeout-validation

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact lowercase candidate commit SHA
        required: true
        type: string
      candidate_source:
        description: Tracked repository-relative closeout candidate source
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-closeout-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LC_ALL: C
      LANG: C
      TZ: UTC
      SAFE_MODE: "1"
      ALLOW_NETWORK: "0"
      APP_ENV: dev
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_OPTIONAL_LOCKS: "0"
      GIT_NO_LAZY_FETCH: "1"
    steps:
      - name: Check out exact closeout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.git_ref }}

      - name: Validate bounded dispatch inputs and clean exact head
        shell: bash
        env:
          SELECTED_REF: ${{ inputs.git_ref }}
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
        run: |
          set -euo pipefail
          [[ "$SELECTED_REF" =~ ^[0-9a-f]{40,64}$ ]]
          test "$(git rev-parse --verify HEAD)" = "$SELECTED_REF"
          (( ${#CANDIDATE_SOURCE} >= 1 && ${#CANDIDATE_SOURCE} <= 512 ))
          [[ "$CANDIDATE_SOURCE" =~ ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]
          case "$CANDIDATE_SOURCE" in
            ""|/*|*\\*|*//*|.|..|./*|*/./*|*/.|../*|*/../*|*/..)
              exit 1
              ;;
          esac
          test "$(git ls-files --error-unmatch -- "$CANDIDATE_SOURCE")" = "$CANDIDATE_SOURCE"
          test -f "$CANDIDATE_SOURCE"
          test ! -L "$CANDIDATE_SOURCE"
          git diff --exit-code
          test -z "$(git status --short --untracked-files=all)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded validation dependency
        run: python -m pip install 'jsonschema==4.23.0'

      - name: Validate exact committed closeout candidate without writing
        shell: bash
        env:
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
        run: >-
          python tools/qa/generate_epic_close_pack.py
          --source "$CANDIDATE_SOURCE"
          --check

      - name: Run retained read-only evidence checks
        shell: bash
        run: |
          set -euo pipefail
          python tools/evidence/update_evidence_index.py --check
          python tools/evidence/orientation_demo.py --check
          ci/checks/check_evidence_index_hash.sh
          python tools/evidence/validate_evidence_paths.py
          ci/checks/check_mirror_schema.sh
          ci/checks/check_final_lf.sh

      - name: Verify validation left the exact checkout clean
        shell: bash
        env:
          SELECTED_REF: ${{ inputs.git_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$SELECTED_REF"
          git diff --exit-code
          test -z "$(git status --short --untracked-files=all)"
